syntax = "proto3";

package olympus.finops.v1;

option go_package = "OlympusGCP-FinOps/40000-Communication-Contracts/430-Protocol-Definitions/000-gen/finops/v1x;finopsv1";

service FinOpsService {
  rpc EstimateCost(EstimateCostRequest) returns (EstimateCostResponse);
  rpc ValidateBudget(ValidateBudgetRequest) returns (ValidateBudgetResponse);
}

message EstimateCostRequest {
  string service = 1;
  string action = 2;
  map<string, string> parameters = 3;
}

message EstimateCostResponse {
  double estimated_usd = 1;
  string confidence = 2;
}

message ValidateBudgetRequest {
  string project_id = 1;
  double requested_amount = 2;
}

message ValidateBudgetResponse {
  bool approved = 1;
  string message = 2;
}


